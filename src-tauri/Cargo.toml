[package]
name = "ebers"
version = "0.1.0"
description = "Gerenciamento de pacientes e consultas do consultório de psicologia"
authors = ["Josimar Zimermann"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ebers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Fotos de perfil: decodificação, redimensionamento e reencode em JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Servidor HTTP local do Auto-cadastro (spec 5.1, ADR-0003).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# Acesso direto ao ebers.db nas rotas do Auto-cadastro. Mesma versão de
# libsqlite3-sys usada pelo sqlx do tauri-plugin-sql (chave `links`: só pode
# haver uma no grafo).
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
# `oneshot` para exercitar as rotas Axum nos testes.
tower = { version = "0.5", features = ["util"] }

