<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Ícone do Ebers: o Ψ (psi, de psicologia) em branco sobre o azul da marca,
    no squircle do macOS (824 px num canvas de 1024, cantos contínuos).
    Este arquivo é a FONTE do ícone. Os PNG/ICNS/ICO ao lado são gerados a
    partir dele por `mise run icone` (tauri icon) — não os edite à mão.
    Cores: tokens de src/index.css convertidos para hex
    (azul da marca oklch(0.54 0.25 264) = #1856FF; luzes do pano de fundo).
  -->
  <defs>
    <clipPath id="recorte">
      <path d="M394.93 100 L629.07 100 c103.23 0 154.85 0 194.28 20.09 a184.33 184.33 0 0 1 80.55 80.55 c20.09 39.43 20.09 91.05 20.09 194.28 L924 629.07 c0 103.23 0 154.85 -20.09 194.28 a184.33 184.33 0 0 1 -80.55 80.55 c-39.43 20.09 -91.05 20.09 -194.28 20.09 L394.93 924 c-103.23 0 -154.85 0 -194.28 -20.09 a184.33 184.33 0 0 1 -80.55 -80.55 c-20.09 -39.43 -20.09 -91.05 -20.09 -194.28 L100 394.93 c0 -103.23 0 -154.85 20.09 -194.28 a184.33 184.33 0 0 1 80.55 -80.55 c39.43 -20.09 91.05 -20.09 194.28 -20.09 Z"/>
    </clipPath>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#498BFF"/>
      <stop offset="0.5" stop-color="#1C58FC"/>
      <stop offset="1" stop-color="#222DD9"/>
    </linearGradient>
    <radialGradient id="luz-violeta" cx="0.98" cy="0.02" r="0.62">
      <stop offset="0" stop-color="#9D57DE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9D57DE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz-menta" cx="0.5" cy="1.08" r="0.6">
      <stop offset="0" stop-color="#00C8C0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00C8C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho" cx="0.5" cy="-0.05" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Fundo: azul da marca com as três luzes do pano de fundo do app -->
  <g clip-path="url(#recorte)">
    <rect x="100" y="100" width="824" height="824" fill="url(#fundo)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#luz-violeta)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#luz-menta)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#brilho)"/>
    <!-- Fio de luz na borda, como o glass-border das superfícies -->
    <path d="M394.93 100 L629.07 100 c103.23 0 154.85 0 194.28 20.09 a184.33 184.33 0 0 1 80.55 80.55 c20.09 39.43 20.09 91.05 20.09 194.28 L924 629.07 c0 103.23 0 154.85 -20.09 194.28 a184.33 184.33 0 0 1 -80.55 80.55 c-39.43 20.09 -91.05 20.09 -194.28 20.09 L394.93 924 c-103.23 0 -154.85 0 -194.28 -20.09 a184.33 184.33 0 0 1 -80.55 -80.55 c-20.09 -39.43 -20.09 -91.05 -20.09 -194.28 L100 394.93 c0 -103.23 0 -154.85 20.09 -194.28 a184.33 184.33 0 0 1 80.55 -80.55 c39.43 -20.09 91.05 -20.09 194.28 -20.09 Z" fill="none" stroke="url(#fio)" stroke-width="6"/>
  </g>

  <!-- Ψ: haste e taça em traço de ponta redonda; sombra suave por baixo -->
  <g fill="none" stroke="#061C6C" stroke-opacity="0.45" stroke-width="109" stroke-linecap="round" stroke-linejoin="round" filter="url(#sombra)" transform="translate(0 18)">
    <path d="M512 291 V733"/>
    <path d="M323 291 V417 A189 189 0 0 0 701 417 V291"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="109" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 291 V733"/>
    <path d="M323 291 V417 A189 189 0 0 0 701 417 V291"/>
  </g>
</svg>
